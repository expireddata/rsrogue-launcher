name: rsrogue installer

# Builds rsrogueSetup.exe. The game server address comes from the RSROGUE_SERVER_HOST secret, so
# it never goes in the repository. Without it, the launcher connects to 127.0.0.1.

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    # Inno Setup (iscc) comes with the windows-2022 runner image
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
        cache: gradle
    - uses: ilammy/msvc-dev-cmd@v1 # for nmake
      with:
        arch: x64
    - name: build detours x64
      shell: cmd
      run: |
        cd detours/src
        nmake
    - name: build launcher
      env:
        RSROGUE_SERVER_HOST: ${{ secrets.RSROGUE_SERVER_HOST }}
      run: ./gradlew build --no-daemon
    - name: x64 installer
      shell: bash
      run: ./build-rsrogue-win64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: rsrogueSetup
        path: rsrogueSetup.exe
        if-no-files-found: error
        retention-days: 14
